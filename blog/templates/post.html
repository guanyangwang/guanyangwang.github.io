<!DOCTYPE html>
<html lang="$lang$">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="$description$">
    <meta name="author" content="$author$">
    <meta property="og:type" content="article">
    <meta property="og:title" content="$title$">
    <meta property="og:description" content="$description$">
$if(alternate_url)$
    <link rel="alternate" hreflang="$alternate_lang$" href="$alternate_url$">
$endif$
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../GuanyangWang_Files/classical.css" type="text/css">
    <link rel="stylesheet" href="./assets/blog.css" type="text/css">
    <title>$title$ - Guanyang Wang</title>
</head>
<body class="blog-page">
<div class="page-container">
    <nav id="layout-menu" aria-label="Primary navigation">
        <div class="menu-item"><a href="../index.html">Home</a></div>
        <div class="menu-item"><a href="../research.html">Research</a></div>
        <div class="menu-item"><a href="../teaching.html">Teaching</a></div>
        <div class="menu-item"><a href="index.html" class="current">Blog</a></div>
        <div class="menu-item"><a href="../news_archive.html">News Archive</a></div>
        <div class="menu-item"><a href="https://github.com/guanyangwang/guanyangwang.github.io/blob/main/GuanyangWang_Files/GuanyangWang_cv_(1).pdf" target="_blank" rel="noopener">CV</a></div>
    </nav>

    <main id="layout-content">
        <article class="blog-article">
            <header class="article-header">
                <p class="article-kicker"><a href="index.html">Blog</a></p>
                <h1>$title$</h1>
                <p class="article-meta"><time datetime="$date$">$date$</time><span aria-hidden="true"> · </span>$author$$if(alternate_url)$<span aria-hidden="true"> · </span><a class="language-link" href="$alternate_url$" lang="$alternate_lang$" hreflang="$alternate_lang$">$alternate_label$</a>$endif$</p>
            </header>
$if(toc)$
            <nav class="article-toc" aria-label="$toc_title$">
                <h2>$toc_title$</h2>
$table-of-contents$
            </nav>
$endif$
            <div class="article-content">
$body$
            </div>
            <!-- Add a Cusdis or Hyvor Talk embed here after configuring the site's provider ID. -->
        </article>

        <footer class="blog-footer">
            <a href="index.html">$back_label$</a>
        </footer>
    </main>
</div>
</body>
</html>
